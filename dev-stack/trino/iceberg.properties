# Trino's Iceberg connector, pointed at the same Lakekeeper this stack runs.
#
# Mounted at /etc/trino/catalog/iceberg.properties, so the catalog is named
# `iceberg` and tables are addressed `iceberg.<namespace>.<table>`.
#
# Property names are taken from the Trino docs source, not from memory:
# docs/src/main/sphinx/object-storage/metastores.md and file-system-s3.md.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=zamboni

# The whole reason this stack vends STS credentials rather than remote-signing:
# with this true, Trino asks Lakekeeper for per-table credentials instead of
# needing its own. Defaults to false, so it has to be said.
iceberg.rest-catalog.vended-credentials-enabled=true

# Lakekeeper hands out namespaces one level deep here, but a real deployment
# nests them, and finding out later that Trino cannot see those tables is a
# poor discovery.
iceberg.rest-catalog.nested-namespace-enabled=true

fs.native-s3.enabled=true
s3.region=local-01
# The compose network gateway, matching S3_GATEWAY in .env: reachable from
# inside the network and from the host, so one endpoint serves both. Trino runs
# inside the network, but the warehouse advertises this address to *every*
# client, and per-table storage config beats client config -- so this has to be
# the same address Zamboni uses, not `minio:9000`.
s3.endpoint=http://172.31.0.1:9010
s3.path-style-access=true
