[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution name differs from the import name (`zamboni`) and from the
# repository name (`Zamboni`), because `zamboni` on PyPI is a dormant
# registration by an unrelated project. All three are independent by design --
# `beautifulsoup4` imports as `bs4` -- and only this one has to be globally
# unique. `iceberg-zamboni` rather than `zamboni-iceberg` so it sorts beside the
# other `iceberg-*` packages. See ZMBNI-1808.
name = "iceberg-zamboni"
version = "0.1.0"
description = "Iceberg table maintenance -- compaction, Z-order, partition evolution, snapshot expiry and orphan-file removal -- without needing Trino or Spark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["iceberg", "lakehouse", "compaction", "maintenance", "pyiceberg", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Upper bound deliberate, not caution. PyIceberg 0.12 corrupts data on a
    # partitioned `upsert` -- it leaves the row it replaced *and* duplicates one
    # it never touched, silently. Reproduced in 25 lines and recorded in
    # docs/upstream-0.12-upsert-regression.md.
    #
    # Without a cap, the day 0.12 publishes any `uv lock --upgrade` pulls it in
    # and nobody had to touch our code for that to happen. Lift it when 0.12 is
    # released *and* the regression is fixed; the feature/pyiceberg-0.12 branch
    # is where that is being tracked.
    "pyiceberg[pyarrow]>=0.11.1,<0.12",
    "duckdb>=1.5.0",
    "pyarrow>=18",
    # zamboni.yml and .env: the DevOps surface (docs/devops.md), not optional.
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Object-store access for a real MinIO/Lakekeeper warehouse.
s3 = ["s3fs>=2024.6.0"]
# Required only for bucket-partitioned tables: PyIceberg delegates the bucket
# transform to its Rust core when writing.
bucket = ["pyiceberg-core>=0.5.0"]
# Local SQL catalog, used by the test suite and handy for dry runs.
sql = ["pyiceberg[sql-sqlite]>=0.11.1,<0.12"]
# Only needed for `--engine trino`. Optional so nobody installs a query-engine
# client to compact a table locally.
trino = ["trino>=0.330.0"]
# Only for `--engine spark`, and the heaviest thing here by a wide margin: a JVM
# plus ~300MB of Spark. Emphatically optional -- the point of this tool is not
# needing Spark.
spark = ["pyspark>=3.5,<5"]
# The same engine over Spark Connect (`--spark-remote sc://...`): the JVM lives
# on the server, so this is 1.5MB of pure Python against pyspark's 434MB, and
# the machine's Java version stops mattering. Mutually exclusive with `spark` --
# both provide the `pyspark` package, so an environment installs one or the
# other. Requires a Spark 4 server; pyspark-client did not exist before 4.0.
spark-connect = ["pyspark-client>=4.0,<5"]

[project.scripts]
zamboni = "zamboni.cli:main"
# Namespaced, not `demo`. Installing this put a bare `demo` on the user's PATH,
# which is a name no library has any business claiming globally -- and the
# collision would be silent, with whichever package installed last winning.
# Inside the repository `./bin/demo` is unchanged.
zamboni-demo = "himsdemo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "mypy>=1.14",
    "pytest>=8",
    "python-dotenv>=1.2.2",
    "ruff>=0.6",
    "iceberg-zamboni[bucket,sql,s3,trino]",
    # Matched to the dev stack's server, not to the extra's range. Iceberg 1.11
    # ships a Spark runtime for 4.0 and no later minor, so the server is 4.0.x;
    # pinning the client to the same minor means the dev-stack tests exercise a
    # matched pair rather than Connect's cross-version skew, which is Spark's
    # promise to keep and not a thing this suite should be proving.
    "pyspark-client>=4.0.4,<4.1",
]

[tool.uv]
# The whole point of this project's environment: never resolve against whatever
# happens to be installed globally. `uv sync` builds .venv from uv.lock alone.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/zamboni", "src/himsdemo"]

# The demo's inputs, 212KB, so `pipx install iceberg-zamboni && zamboni-demo`
# works without a clone. Listed path by path rather than including
# `data/healthims` wholesale: that directory also accumulates the generated
# warehouse and catalog -- 9MB and growing after a run -- and a glob would ship
# whatever happened to be lying there when the wheel was built.
#
# The prose in that directory is deliberately absent. It is reference material
# the demo never reads, and `himsdemo.cli.DOCS_URL` points at it on GitHub.
[tool.hatch.build.targets.wheel.force-include]
"data/healthims/table_schema.json" = "himsdemo/data/table_schema.json"
"data/healthims/table-config.json" = "himsdemo/data/table-config.json"
"data/healthims/day1" = "himsdemo/data/day1"
"data/healthims/day2" = "himsdemo/data/day2"
"data/healthims/day3" = "himsdemo/data/day3"
"data/healthims/day4" = "himsdemo/data/day4"
"data/healthims/day5" = "himsdemo/data/day5"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A marker rather than a -k expression, because CI has to select these
# exactly: the Spark fixtures skip on a closed port, so a filter that
# quietly matched nothing would report a green Spark job that ran no Spark.
markers = ["spark: live tests against the dev stack's Spark Connect server"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ISC", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to pin internal behaviour.
"tests/*" = ["SLF001"]

[tool.mypy]
# Scoped to the shipped packages and the scripts, not to tests. Test code
# deliberately reaches into private internals and monkeypatches types; checking
# it would generate noise that trains people to ignore the checker.
files = ["src", "scripts"]
python_version = "3.11"
# PyIceberg ships no stubs for several modules we depend on.
ignore_missing_imports = true
# Not `strict`. This package drives private PyIceberg internals on purpose, and
# a strict run is dominated by untyped-call noise from those. The rules enabled
# here are the ones that catch the errors this codebase actually makes: None
# reaching an attribute access, and a value used as a type it is not. Two of the
# four bugs found by live verification were exactly that.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Installing zamboni[spark-connect] put `pyspark` in the dev environment, so
# mypy started following the import inside SparkMaintainer.connect() and on
# into numpy's bundled stubs -- which use PEP 695 `type` statements and so are
# rejected under `python_version = "3.11"`. That is numpy declaring a 3.12
# floor for its own stubs, not a problem in this codebase, and dropping our
# floor to make a third party's stubs parse would trade a real check for a
# cosmetic one. Skip them instead; we do not type-check other people's code.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pyspark", "pyspark.*"]
# Both the bare name and the wildcard: the syntax error is raised while
# processing `numpy` itself, which "numpy.*" does not match.
follow_imports = "skip"
follow_imports_for_stubs = true
