[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zamboni"
version = "0.1.0"
description = "Iceberg table maintenance (compaction) for MinIO + Lakekeeper, without Trino or Spark"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["iceberg", "lakehouse", "compaction", "maintenance", "pyiceberg", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Upper bound deliberate, not caution. PyIceberg 0.12 corrupts data on a
    # partitioned `upsert` -- it leaves the row it replaced *and* duplicates one
    # it never touched, silently. Reproduced in 25 lines and recorded in
    # docs/upstream-0.12-upsert-regression.md.
    #
    # Without a cap, the day 0.12 publishes any `uv lock --upgrade` pulls it in
    # and nobody had to touch our code for that to happen. Lift it when 0.12 is
    # released *and* the regression is fixed; the feature/pyiceberg-0.12 branch
    # is where that is being tracked.
    "pyiceberg[pyarrow]>=0.11.1,<0.12",
    "duckdb>=1.5.0",
    "pyarrow>=18",
    # zamboni.yml and .env: the DevOps surface (docs/devops.md), not optional.
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Object-store access for a real MinIO/Lakekeeper warehouse.
s3 = ["s3fs>=2024.6.0"]
# Required only for bucket-partitioned tables: PyIceberg delegates the bucket
# transform to its Rust core when writing.
bucket = ["pyiceberg-core>=0.5.0"]
# Local SQL catalog, used by the test suite and handy for dry runs.
sql = ["pyiceberg[sql-sqlite]>=0.11.1,<0.12"]
# Only needed for `--engine trino`. Optional so nobody installs a query-engine
# client to compact a table locally.
trino = ["trino>=0.330.0"]

[project.scripts]
zamboni = "zamboni.cli:main"
demo = "himsdemo.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "mypy>=1.14",
    "pytest>=8",
    "python-dotenv>=1.2.2",
    "ruff>=0.6",
    "zamboni[bucket,sql,s3,trino]",
]

[tool.uv]
# The whole point of this project's environment: never resolve against whatever
# happens to be installed globally. `uv sync` builds .venv from uv.lock alone.
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/zamboni", "src/himsdemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ISC", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to pin internal behaviour.
"tests/*" = ["SLF001"]

[tool.mypy]
# Scoped to the shipped packages and the scripts, not to tests. Test code
# deliberately reaches into private internals and monkeypatches types; checking
# it would generate noise that trains people to ignore the checker.
files = ["src", "scripts"]
python_version = "3.11"
# PyIceberg ships no stubs for several modules we depend on.
ignore_missing_imports = true
# Not `strict`. This package drives private PyIceberg internals on purpose, and
# a strict run is dominated by untyped-call noise from those. The rules enabled
# here are the ones that catch the errors this codebase actually makes: None
# reaching an attribute access, and a value used as a type it is not. Two of the
# four bugs found by live verification were exactly that.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
