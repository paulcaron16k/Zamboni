name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref. Not on main, where
# every commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.11.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --frozen fails if uv.lock is stale against pyproject.toml, so a
      # dependency edit that forgot to re-lock cannot reach main.
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts

      # A hook on a different ruff than CI rewrites files CI considers correct,
      # so every commit churns. Caught this locally: the two disagreed on one
      # blank line.
      - name: pre-commit pins the same ruff as uv.lock
        run: |
          locked=$(uv run ruff --version | awk '{print $2}')
          hooked=$(grep -A1 'ruff-pre-commit' .pre-commit-config.yaml | grep 'rev:' | tr -d ' v' | cut -d: -f2)
          test "$locked" = "$hooked" \
            || { echo "::error::ruff mismatch -- uv.lock has $locked, .pre-commit-config.yaml pins $hooked"; exit 1; }

      # Config declares its own file set, so no arguments. Catches None reaching
      # an attribute access and values used as types they are not -- two of the
      # four bugs live verification found were exactly that.
      - run: uv run mypy

      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the pinned development version; 3.11 is the floor that
        # pyproject.toml claims to support. Testing only the pin would let a
        # 3.12-only construct ship under a >=3.11 requirement.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      # The dev-stack tests are excluded rather than left to skip: this job has
      # no Docker services, and the dedicated job below is where they must run.
      - run: uv run --python ${{ matrix.python }} pytest -q --ignore=tests/test_dev_stack.py

  executables:
    # bin/zamboni and bin/zamboni-demo are PEP 723 scripts that reference the project as
    # an editable path install. Two bugs have already come from that path: one
    # absolute (broke on directory rename) and one non-editable (ran stale code).
    # Both were only visible when running from outside the project directory.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: Regenerating them must be a no-op
        run: |
          uv run scripts/build-executable.py
          git diff --exit-code -- bin/ \
            || { echo "::error::bin/ is stale -- run: uv run scripts/build-executable.py"; exit 1; }

      - name: Run from outside the project directory
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/bin/zamboni" doctor
          "$GITHUB_WORKSPACE/bin/zamboni" --help > /dev/null

  spark:
    # Spark gets its own job rather than a step in dev-stack, because it is the
    # only one that builds an image (1.57GB: Spark 4, the Iceberg runtime, and
    # 558MB of AWS SDK that hadoop-aws pulls in) and because its failures are
    # its own. Folding it into dev-stack would make one red tick mean either
    # "reclamation is broken" or "Spark is broken", which is the kind of
    # ambiguity that gets a job ignored.
    #
    # Spark Connect, so the runner needs no Java and the client is ~1.5MB. What
    # this job proves that tests/test_maintainers.py cannot: that a real server
    # accepts the procedure calls we build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: Check the pinned subnet is free
        run: |
          if docker network ls -q | xargs -r -I{} docker network inspect {} \
               --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' | grep -q '^172\.31\.0\.0/24$'; then
            echo "::error::172.31.0.0/24 is already in use; change it in dev-stack/docker-compose.yaml and S3_GATEWAY"
            exit 1
          fi

      - name: Bring up the stack with Spark
        working-directory: dev-stack
        run: |
          cp .env.sample .env
          docker compose --profile spark up -d --wait
          docker compose ps

      - name: Bootstrap Lakekeeper and create the warehouse
        working-directory: dev-stack
        run: uv run bootstrap.py

      # The Spark fixtures skip on a closed port by design, so "0 failures" is
      # not the same as "Spark was tested" -- a server that never started would
      # produce a green tick and no coverage. Selecting by marker guarantees the
      # set is non-empty, and -W error::pytest.PytestUnraisableExceptionWarning
      # does not help here, so the skip count is checked outright.
      - name: Run the live Spark tests
        env:
          ZAMBONI_REQUIRE_DEV_STACK: "1"
        run: |
          uv run pytest tests/test_dev_stack.py -v -m spark | tee spark.log
          if grep -qE "[0-9]+ skipped" spark.log; then
            echo "::error::a live Spark test skipped; the Connect server was not reachable"
            exit 1
          fi

      - name: Stack logs
        if: failure()
        working-directory: dev-stack
        run: docker compose --profile spark logs --tail 200

      - name: Tear down
        if: always()
        working-directory: dev-stack
        run: docker compose --profile spark down -v

  dev-stack:
    # The job that exercises what unit tests cannot: a real REST catalog, real
    # object storage, and the S3 permissions the reclaim operations need.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      # The stack pins a subnet so the S3 endpoint it advertises is a knowable
      # address. Fail with a clear message rather than a confusing compose error.
      - name: Check the pinned subnet is free
        run: |
          if docker network ls -q | xargs -r -I{} docker network inspect {} \
               --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}' | grep -q '^172\.31\.0\.0/24$'; then
            echo "::error::172.31.0.0/24 is already in use; change it in dev-stack/docker-compose.yaml and S3_GATEWAY"
            exit 1
          fi

      # Using the committed .env.sample verbatim also proves it is a working
      # template, which is the thing that rots first in a dev stack.
      - name: Bring up the stack
        working-directory: dev-stack
        run: |
          cp .env.sample .env
          docker compose --profile trino up -d --wait
          docker compose ps

      - name: Bootstrap Lakekeeper and create the warehouse
        working-directory: dev-stack
        run: uv run bootstrap.py

      # ZAMBONI_REQUIRE_DEV_STACK turns "cannot reach the stack" from a skip into
      # a failure. Without it a stack that never started produces a suite of
      # skips, and a green tick that means nothing was tested.
      - name: Run the dev-stack tests
        env:
          ZAMBONI_REQUIRE_DEV_STACK: "1"
        run: uv run pytest tests/test_dev_stack.py -v

      - name: The demo, end to end on Lakekeeper and MinIO
        env:
          ZAMBONI_URI: http://localhost:8182/catalog
          ZAMBONI_WAREHOUSE: zamboni
        run: |
          ./bin/zamboni-demo --catalog lakekeeper clear
          ./bin/zamboni-demo --catalog lakekeeper next-day
          ./bin/zamboni-demo --catalog lakekeeper maintenance --reclaim-now
          ./bin/zamboni-demo --catalog lakekeeper query
          ./bin/zamboni-demo --catalog lakekeeper clear

      - name: Stack logs
        if: failure()
        working-directory: dev-stack
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        working-directory: dev-stack
        run: docker compose down -v
