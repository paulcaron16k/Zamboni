# Publish to PyPI on a version tag.
#
# **Trusted publishing, not an API token.** PyPI mints a short-lived credential
# from GitHub's OIDC identity for this repository, workflow and environment, so
# there is no long-lived secret in the repository settings to leak, rotate or
# forget. It requires a one-time setup on PyPI (Publishing -> add a pending
# publisher for `iceberg-zamboni`, owner `paulcaron16k`, repo `Zamboni`,
# workflow `release.yml`, environment `pypi`) and nothing after that.
#
# The tag is the trigger, matching docs/releasing.md's `vMAJOR.MINOR.PATCH`
# convention -- so publishing is `git tag -a v0.2.0 && git push --tags` and
# nothing else. There is deliberately no manual `workflow_dispatch`: a release
# that can be fired without a tag is a release nobody can reconstruct later.
#
# **A GitHub release too, carrying the wheel, the sdist and the published
# schemas** (#183). The distributions are the ones uploaded to PyPI. Producers that
# may not depend on this package -- target-iceberg emitting `write.completed` --
# vendor the JSON Schema from here. The release is drafted *before* PyPI and
# made public only *after* it: a draft's assets cannot be downloaded publicly,
# so nothing is published unless both succeed, and a version never reaches PyPI
# without its schemas. The paths attached are promised in docs/write-completed.md
# and docs/table-config.md; tests/test_release_assets.py holds the three together.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The full suite runs again here rather than trusting the run from the commit
  # this tag points at. Cheap, and the alternative is publishing an artifact
  # whose tests were green on a different tree.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -q --ignore=tests/test_dev_stack.py

      # The tag must agree with the version in pyproject.toml. A mismatch here
      # means a v0.2.0 tag publishing 0.1.0, which is unrecoverable on PyPI:
      # a version number can never be reused, even after deletion.
      - name: The tag matches the declared version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$tagged" = "$declared" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $declared"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.26"
      - run: uv build
      # Catches a malformed README before PyPI rejects the upload, which it does
      # after the version is already consumed.
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Draft the GitHub release, schemas attached, before anything is public. A
  # missing schema fails `gh release create`, so the version is never consumed
  # on PyPI. A draft left by an earlier failed attempt is replaced. A published
  # release for this tag is never deleted; create is expected to refuse it
  # (not tested -- it needs a published release).
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The notes are the tag's message -- the changelog section, per
      # docs/releasing.md §3. checkout's shallow fetch is not documented to bring
      # the annotated tag object (not verified either way), so fetch it by name.
      - run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      # The wheel and sdist attached are the artifact `publish` uploads, not a
      # second build, so the release carries byte-for-byte what PyPI serves.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Draft the release with the built distributions and the schemas
        run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          test -s notes.md || { echo "::error::$TAG has no tag message to use as notes"; exit 1; }
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md \
            dist/* \
            src/zamboni/zamboni-write-completed_spec.json \
            src/zamboni/zamboni-table-config_spec.json

  publish:
    needs: draft-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # PyPI has the version, so the release and its schemas go public.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
